[project]
name = "clippers"
version = "0.1.0"
description = "Auto-highlight clipper: stream recordings to captioned 9:16 clips"
readme = "README.md"
authors = [
    { name = "Abdulrasaq", email = "rasaqadewuyi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in PyAV 19.
    # Drop this cap once a faster-whisper release supports PyAV 19 (test: pytest -m slow).
    "av<19",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "pydantic>=2.14.3",
    "typer>=0.29.2",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
clippers = "clippers.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle basics, I = import sorting, B = bugbear (real bugs),
# UP = pyupgrade (modern syntax), SIM = simplifications, PTH = prefer pathlib over os.path
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: loads a real Whisper model (downloads ~75MB on first run). Run with: pytest -m slow",
]

[tool.uv]
# Dev machine is an Intel Mac; newer onnxruntime/ctranslate2 releases dropped those wheels.
# This makes uv pick the newest versions that still install here.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# Our own code gets strict checks; tests stay on standard (pytest's fixtures and
# monkeypatching are dynamic by nature).
strict = ["src"]
