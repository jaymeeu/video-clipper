[project]
name = "clippers"
version = "0.1.0"
description = "Auto-highlight clipper: stream recordings to captioned 9:16 clips"
readme = "README.md"
authors = [
    { name = "Abdulrasaq", email = "rasaqadewuyi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.29.2",
]

[project.scripts]
clippers = "clippers:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle basics, I = import sorting, B = bugbear (real bugs),
# UP = pyupgrade (modern syntax), SIM = simplifications, PTH = prefer pathlib over os.path
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
